# Bondy as a pre-commit hook: pre-commit hands it the HTML files of the commit
# (or all of them with `--all-files`) and `bondy scan` takes several paths. It
# runs offline (--no-llm), writes nothing into the project (--no-cache) and
# never executes the scanned files.
#
# .pre-commit-config.yaml of your project:
#
#   repos:
#     - repo: https://github.com/EvePulido/Bondy
#       rev: v0.1.1                           # a release tag or a commit
#       hooks:
#         - id: bondy
#           args: [--fail-on, warning]            # extra `bondy scan` flags
#
# Notes: explicit files are always scanned (bondy.toml include/exclude only
# filter folders). With many files pre-commit may split them over several runs.
# Report paths are relative to the files' common folder. Without Chromium
# (`python -m playwright install chromium`) or a system Chrome/Edge, Bondy runs in
# static mode and says so.
- id: bondy
  name: Bondy accessibility check (changed HTML)
  description: Scan changed HTML files for WCAG issues, deterministic checks only.
  entry: bondy scan --no-llm --no-cache
  language: python
  types: [html]
  pass_filenames: true
