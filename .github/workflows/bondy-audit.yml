name: Bondy CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run code quality checks (Ruff)
        run: uv run ruff check .

      - name: Run Tests (Unit)
        timeout-minutes: 15
        run: uv run pytest tests/unit -o faulthandler_timeout=240
