name: CI

# Quality gate for every push/PR: lint, format, types and unit tests on
# Linux, Windows and macOS. Separate from bondy-audit.yml on purpose.
# Unit tests never call Gemini (they use FakeProvider / --no-llm).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    env:
      # UTF-8 I/O on every OS (Windows defaults to a legacy code page).
      PYTHONUTF8: "1"
      UV_FROZEN: "1"
      # Use the interpreter setup-python installed, not another one on the runner.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      # SHAs verified with `git ls-remote` (same ones as action.yml / ci-example.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Pinned from PyPI instead of a third-party action (no unverified SHA).
      - name: Install uv
        run: python -m pip install "uv==0.11.21"

      # `lint` brings ruff + ty (they are pinned in uv.lock); server+agent are
      # needed by the web-app unit tests.
      - name: Install dependencies
        run: uv sync --frozen --extra server --extra agent --extra lint

      # Many unit tests drive a real browser; without Chromium they skip.
      - name: Install Playwright Chromium (Linux, with system deps)
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: uv run playwright install chromium

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check bondy tests

      # faulthandler_timeout dumps every thread's stack if a test hangs, so a
      # stuck run shows WHERE instead of burning the job until the timeout.
      - name: Unit tests
        timeout-minutes: 15
        run: uv run pytest tests/unit -q -o faulthandler_timeout=240

  # Builds the image WITH Chromium and checks that the browser really works
  # inside it. Not run on pull requests (about 3 minutes and ~2.5 GB image):
  # it runs on pushes to main and on demand (workflow_dispatch).
  docker:
    name: docker image (with Chromium)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image with Chromium
        run: docker build --build-arg INSTALL_CHROMIUM=true -t bondy:ci .

      # `bondy doctor` must report the Playwright Chromium and exit 0.
      - name: bondy doctor
        run: |
          docker run --rm bondy:ci bondy doctor | tee doctor.txt
          grep -q "Scans will use: Playwright Chromium" doctor.txt

      # Deterministic scan (no Gemini, no API key) of the bundled examples.
      # They have findings, so exit code 1 is the expected result; anything
      # else, or a STATIC MODE note, means the browser did not work.
      - name: bondy scan --no-llm examples
        run: |
          set +e
          docker run --rm bondy:ci bondy scan examples --no-llm | tee scan.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          if grep -q "STATIC MODE" scan.txt; then exit 1; fi
