[project]
name = "bondy"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]



# Core: deterministic scanners + Gemini client. No server, ADK or GCP.
dependencies = [
    "playwright>=1.40.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
]
requires-python = ">=3.11,<3.14"

[project.scripts]
bondy = "bondy.cli:main"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "pre-commit>=3.7.1,<4.0.0",
    # The unit tests exercise the web app, which needs the server and agent extras
    "bondy[server,agent]",
]

[project.optional-dependencies]
# Local web UI + HTTP API (`bondy.fast_api_app`). Requires `agent` as well today.
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-dotenv>=1.0.0",
]
# ADK agent mode (BondyAccessibilityAgent).
agent = [
    "google-adk>=2.0.0,<3.0.0",
]
# Optional Google Cloud integrations (Cloud Logging, GCS artifacts, OTel GenAI
# telemetry, Vertex AI extras of ADK). Off by default; see README.
gcp = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
]
# GitHub reader MCP server (`mcp_server/github_server.py`).
mcp = [
    "mcp>=1.0.0",
    "PyGithub>=2.1.0",
]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["bondy"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Rules that were noisy with third-party / dynamic code. unresolved-import,
# unresolved-attribute and invalid-argument-type are active again (bondy/ is clean).
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge,fixel"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json,*Bondy*,GEMINI.md,*OPTIMIZATION_GUIDE.md"




[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["bondy"]


